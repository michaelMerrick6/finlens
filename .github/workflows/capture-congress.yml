name: Capture Congress

on:
  # Hourly capture; Vercel Hobby supports only a daily dispatch fallback.
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: congress-data-and-signals
  cancel-in-progress: false

jobs:
  capture-congress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install OCR system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Run Congress Parser Tests
      env:
        SUPABASE_URL: https://example.supabase.co
        SUPABASE_SERVICE_KEY: test-key
      if: github.event_name == 'workflow_dispatch'
      working-directory: scripts
      run: |
        python test_house_parser_regressions.py
        python test_senate_parser_regressions.py
        python test_capitol_trades_support.py
        python test_congress_capture.py
        python test_recent_congress_audit_smoke.py
        python test_schema_performance_indexes.py

    - name: Capture Congress Trades
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        HOUSE_AUDIT_LIMIT: '5'
        SENATE_AUDIT_LIMIT: '5'
        CONGRESS_AUDIT_DOCUMENT_TIMEOUT: '30'
        FINLENS_DAILY_MODE: '1'
        PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/ops
        CAPITOL_TRADES_LOOKBACK_DAYS: '21'
        CAPITOL_TRADES_MAX_PAGES: '20'
        CAPITOL_TRADES_AUDIT_DAYS: '21'
      run: |
        cd scripts
        status=0
        python capture_congress.py || status=1
        echo "=== Member Backfill ==="
        python ../ops/backfill_recent_politician_member_ids.py || status=1
        echo "=== Congress Audit ==="
        python ../ops/audit_recent_congress_coverage.py || status=1
        echo "=== Capitol Lead Capture ==="
        python capture_capitol_trades_leads.py || status=1
        echo "=== Capitol Gap Audit ==="
        python ../ops/audit_capitol_trades_gaps.py || status=1
        exit "$status"

    - name: Notify on Failure
      if: failure()
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        if [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "DISCORD_WEBHOOK_URL is not configured; skipping failure notification."
          exit 0
        fi
        curl -H "Content-Type: application/json" -d '{"content": "🚨 **FinLens**: Congress capture workflow failed."}' $DISCORD_WEBHOOK_URL
