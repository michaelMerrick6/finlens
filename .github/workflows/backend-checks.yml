name: Backend Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: congress_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-key
      VAIL_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/congress_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt "psycopg[binary]"
      - name: Validate dependencies
        run: pip check
      - name: Run pipeline regression tests
        run: python scripts/run_tests.py
