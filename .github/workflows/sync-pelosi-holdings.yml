name: Sync Pelosi Holdings

on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pelosi-holdings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install updater dependencies
        run: pip install -r scripts/requirements.txt
      - name: Test holdings updater
        run: python -m unittest discover -s scripts -p 'test_pelosi_holdings_sync.py'
      - name: Refresh Pelosi holdings overlay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sync_pelosi_holdings.py
