name: Refresh Research Classifications
on:
  schedule:
    - cron: '40 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-classifications
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sync_research_classifications.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
